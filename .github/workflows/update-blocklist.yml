name: Update gambling blocklist

on:
  schedule:
    # Mondays, 04:17 UTC. Avoid the top of the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      offline:
        description: 'Rebuild using YOUR saved upstream snapshot (no external download)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: bet-stop-blocklist-update
  cancel-in-progress: false

jobs:
  update:
    # Only publish from the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test updater
        run: npm test
      - name: Fetch or rebuild blocklist
        env:
          OFFLINE_MODE: ${{ inputs.offline }}
        shell: bash
        run: |
          if [[ "$OFFLINE_MODE" == "true" ]]; then
            node scripts/update.mjs --offline
          else
            node scripts/update.mjs
          fi
      - name: Commit OWNED blocklist and upstream snapshot
        shell: bash
        run: |
          git add -- hosts data/upstream-snapshot.hosts
          if git diff --cached --quiet; then
            echo 'No blocklist changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(blocklist): update owned gambling list'
          git push
